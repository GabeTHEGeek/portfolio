backend:
  name: portfolio-github
  repo: GabeTHEGeek/portfolio
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  site_domain: gabrielpendleton.me

# On localhost, Decap uses its local proxy instead of the production OAuth flow.
# The live CMS continues to use the GitHub backend above.
local_backend: true

site_url: https://gabrielpendleton.me
display_url: https://gabrielpendleton.me
publish_mode: simple
media_folder: src/assets/media
public_folder: ../../assets/media

collections:
  - name: projects
    label: Projects
    sortable_fields: []
    folder: src/content/projects
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{fields.slug}}"
    preview_path: "projects/{{fields.slug}}/"
    editor: { preview: false }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: URL slug, name: slug, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase words separated by hyphens.'], hint: 'Unique project URL. Do not change existing slugs without a redirect.' }
      - { label: Description, name: description, widget: text }
      - { label: Hero image, name: heroImage, widget: image, required: false, choose_url: false }
      - { label: YouTube header video, name: videoUrl, widget: string, required: false, pattern: ['^https?://((www|m)\.youtube\.com|youtube\.com|youtu\.be)/.+$', 'Enter a full YouTube or youtu.be URL.'], hint: 'Optional. When provided, the video replaces the hero image on the project page. The hero image is still used on project cards and for sharing.' }
      - label: Screenshots
        name: screenshots
        widget: list
        required: false
        default: []
        field: { label: Image, name: image, widget: image, choose_url: false }
      - { label: Tags, name: tags, widget: list, required: false, default: [] }
      - { label: Status, name: status, widget: select, options: [concept, in-progress, in-development, launched, archived] }
      - { label: Live URL, name: liveUrl, widget: string, required: false, pattern: ['^https?://[^\s]+$', 'Enter a full HTTP or HTTPS URL.'] }
      - { label: GitHub URL, name: githubUrl, widget: string, required: false, pattern: ['^https?://[^\s]+$', 'Enter a full HTTP or HTTPS URL.'] }
      - { label: Featured, name: featured, widget: boolean, default: false, required: false }
      - { label: Kind, name: kind, widget: select, options: [ai, product], default: product }
      - { label: Company, name: company, widget: string, required: false }
      - { label: Role, name: role, widget: string, required: false }
      - { name: order, widget: hidden, default: 99 }
      - { label: Publish date, name: publishDate, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: Body, name: body, widget: markdown }

  - name: writing
    label: Writing
    sortable_fields: []
    folder: src/content/writing
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{fields.slug}}"
    preview_path: "writing/{{fields.slug}}/"
    editor: { preview: false }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: URL slug, name: slug, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase words separated by hyphens.'], hint: 'Unique article URL. Preserve existing slugs.' }
      - { label: Description, name: description, widget: text }
      - { label: Cover image, name: coverImage, widget: image, required: false, choose_url: false }
      - { label: YouTube header video, name: videoUrl, widget: string, required: false, pattern: ['^https?://((www|m)\.youtube\.com|youtube\.com|youtu\.be)/.+$', 'Enter a full YouTube or youtu.be URL.'], hint: 'Optional. When provided, the video replaces the cover image in the article header. The cover image is still used on article cards and for sharing.' }
      - { label: Category, name: category, widget: string }
      - { label: Tags, name: tags, widget: list, required: false, default: [] }
      - { label: Publish date, name: publishDate, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { name: order, widget: hidden, default: 99 }
      - label: Related project
        name: relatedProject
        widget: relation
        collection: projects
        search_fields: [title, company, slug]
        value_field: slug
        display_fields: [title]
        required: false
        hint: Optional. Links this article, the project page, and its GitHub repository in Ask Gabriel sources.
      - { label: Author, name: author, widget: string, default: Gabriel Pendleton }
      - { label: Body, name: body, widget: markdown }
